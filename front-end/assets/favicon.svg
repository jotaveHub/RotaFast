<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favRouteGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="favPinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados estilo App Icon -->
  <rect width="160" height="160" rx="36" fill="#0F172A" />
  <rect width="158" height="158" x="1" y="1" rx="35" stroke="#1E293B" stroke-width="2" />

  <!-- Trajeto Otimizado de Fundo -->
  <path d="M 32 122 Q 55 135 80 92 T 128 72" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.15" fill="none" />
  <path d="M 32 122 Q 55 135 80 92 T 128 72" stroke="url(#favRouteGradient)" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <circle cx="32" cy="122" r="5" fill="#059669" />
  <circle cx="128" cy="72" r="5" fill="#EA580C" />

  <!-- Pin Central com Chevrons de Velocidade -->
  <g transform="translate(48, 22)" filter="url(#favGlow)">
    <path d="M 32 0 C 14.3 0 0 14.3 0 32 C 0 54 32 86 32 86 C 32 86 64 54 64 32 C 64 14.3 49.7 0 32 0 Z" fill="url(#favPinGradient)" />
    <circle cx="32" cy="32" r="18" fill="#0F172A" />
    <!-- Símbolo de Avanço Rápido / Fast -->
    <path d="M 25 23 L 36 32 L 25 41" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 34 23 L 45 32 L 34 41" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
