<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 6 515 144" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente do Trajeto Principal (Azul para Ciano Elétrico) -->
    <linearGradient id="routeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Gradiente do Pin Central -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gradiente do Raio/Velocidade -->
    <linearGradient id="fastGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Brilho e Sombra Suave -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ==================== SÍMBOLO / ÍCONE ==================== -->
  <g transform="translate(25, 12)" filter="url(#glowEffect)">
    <!-- Malha de Conexões Espaciais (Fundo do Ícone) -->
    <path d="M 30 110 L 70 30 L 115 75 L 70 125 Z" stroke="#0EA5E9" stroke-width="1.8" stroke-dasharray="4 4" stroke-opacity="0.45" fill="none" />
    <circle cx="30" cy="110" r="4.5" fill="#059669" filter="url(#subtleShadow)" />
    <circle cx="115" cy="75" r="4.5" fill="#EA580C" filter="url(#subtleShadow)" />

    <!-- Trajeto Dinâmico Otimizado (Curva de Velocidade com Halo) -->
    <path d="M 28 110 Q 55 125 70 85 T 115 75" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.2" fill="none" />
    <path d="M 28 110 Q 55 125 70 85 T 115 75" stroke="url(#routeGradient)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Pin Geográfico de Precisão com Seta de Aceleração -->
    <g transform="translate(42, 10)" filter="url(#subtleShadow)">
      <!-- Corpo do Pin -->
      <path d="M 28 0 C 12.5 0 0 12.5 0 28 C 0 48 28 78 28 78 C 28 78 56 48 56 28 C 56 12.5 43.5 0 28 0 Z" fill="url(#pinGradient)" />
      
      <!-- Anel de Contraste Interno -->
      <circle cx="28" cy="28" r="16" fill="#0F172A" />

      <!-- Vetor de Velocidade / Rota Rápida (Fast Forward Chevron) -->
      <path d="M 22 20 L 32 28 L 22 36" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 29 20 L 39 28 L 29 36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Pulso da Origem (Anel Verde) -->
    <circle cx="30" cy="110" r="8" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  </g>

  <!-- ==================== TIPOGRAFIA / WORDMARK ==================== -->
  <g transform="translate(180, 96)">
    <!-- Texto "Rota" -->
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
      Rota
    </text>

    <!-- Texto "Fast" (com Gradiente e Destaque) -->
    <text x="160" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" font-style="italic" letter-spacing="-0.5" fill="url(#routeGradient)">
      Fast
    </text>

    <!-- Linha de Aceleração Subjacente -->
    <path d="M 160 12 L 305 12" stroke="url(#routeGradient)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="312" cy="12" r="3" fill="#38BDF8" />

    <!-- Subtítulo Técnico Geográfico -->
    <text x="2" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.7" fill="#94A3B8">
      OTIMIZAÇÃO INTELIGENTE DE ROTAS
    </text>
  </g>
</svg>
